<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0c12" />
    <meta name="description" content="STREET FIGHT UK - a gritty 2.5D street-fighting action RPG set in modern Britain." />
    <title>STREET FIGHT UK</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="game"></div>
    <div id="ui"></div>
    <div id="boot" role="status" aria-live="polite" style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#0a0c12;color:#e8e6df;font-family:'Barlow Condensed',system-ui,sans-serif;z-index:50;transition:opacity .25s ease">
      <div style="font-family:Anton,Impact,sans-serif;font-size:34px;letter-spacing:.04em;color:#f2c230">STREET FIGHT UK</div>
      <div style="width:min(260px,60vw);height:5px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden"><div id="boot-bar" style="height:100%;width:4%;background:#f2c230;transition:width .2s linear"></div></div>
      <div id="boot-text" style="font-size:14px;letter-spacing:.08em;opacity:.65">LOADING</div>
    </div>
    <div class="rotate-hint">Turn your phone sideways to fight</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
