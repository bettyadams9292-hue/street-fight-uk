<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFUK Asset Studio v6</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#111820;color:#f1f3f6;font:15px system-ui,sans-serif}header,main{max-width:1000px;margin:auto;padding:16px}h1{font-size:23px}p,#status{color:#b9c6d3}.layout{display:grid;grid-template-columns:1fr;gap:15px}#stage{height:430px;width:100%;display:block;touch-action:none;border-radius:14px;background:#29343d}.controls{display:flex;flex-wrap:wrap;gap:8px}button,select{padding:12px;background:#283b4c;color:#fff;border:1px solid #607487;border-radius:9px;font-size:15px}select{flex:1;min-width:180px}button{cursor:pointer}.facts{padding:14px;border:1px solid #45525c;border-radius:12px;color:#d5e0e8;line-height:1.8}.notice{color:#edc783}small{color:#9daab8}</style></head><body>
<header><h1>Street Fight UK — 3D Asset Studio v6</h1><p>One WebGL renderer, one asset at a time. Designed for iPhone Safari. Standalone assets only.</p><div id="status">Loading renderer and models…</div></header>
<main><div class="layout"><div class="controls"><button id="prev">← Previous</button><select id="asset" aria-label="Choose asset"></select><button id="next">Next →</button></div><canvas id="stage"></canvas><div class="controls"><button id="left">↶ Rotate</button><button id="right">Rotate ↷</button><button id="near">Zoom +</button><button id="far">Zoom −</button><button id="reset">Reset view</button></div><div id="facts" class="facts">Preparing…</div><small>Drag on the model to rotate. Pinch to zoom. All 21 models share a single WebGL context to avoid Safari's renderer limit.</small></div></main>
<script type="module">
const status=document.getElementById('status'),canvas=document.getElementById('stage'),facts=document.getElementById('facts'),selector=document.getElementById('asset');
try{
 const THREE=await import('https://esm.sh/three@0.180.0');
 const ts=await import('https://esm.sh/typescript@5.9.3');
 const url='https://raw.githubusercontent.com/bettyadams9292-hue/street-fight-uk/e1c99a2f47c0a03f2008fc9c4082f37020cd59d7/newassetsfromchatgpt.ts';
 const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('Model fetch HTTP '+response.status);
 const source=await response.text();
 const compiled=ts.transpileModule(source,{compilerOptions:{module:ts.ModuleKind.ESNext,target:ts.ScriptTarget.ES2022}}).outputText;
 const js=compiled.replace(/from\s*(['"])three\1/g,"from 'https://esm.sh/three@0.180.0'");
 const blob=URL.createObjectURL(new Blob([js],{type:'text/javascript'}));
 const {createStreetAsset,STREET_ASSET_NAMES,auditStreetAsset}=await import(blob);URL.revokeObjectURL(blob);
 const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false,powerPreference:'low-power'});
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));renderer.outputColorSpace=THREE.SRGBColorSpace;
 renderer.setClearColor(0x29343d);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;
 const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x8496a8,2.6));
 const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(4,7,8);scene.add(key);
 const fill=new THREE.DirectionalLight(0xc1d7ff,1.3);fill.position.set(-4,4,-5);scene.add(fill);
 const camera=new THREE.PerspectiveCamera(40,1,.01,100);
 const label=n=>n.replace(/([A-Z])/g,' $1').replace(/^./,x=>x.toUpperCase());
 STREET_ASSET_NAMES.forEach((name,i)=>{const o=document.createElement('option');o.value=i;o.textContent=(i+1)+'. '+label(name);selector.append(o)});
 let active=null,index=0,yaw=.55,pitch=.25,zoom=1,center=new THREE.Vector3(),radius=2;
 function resize(){const w=Math.max(1,canvas.clientWidth),h=Math.max(1,canvas.clientHeight);renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();render()}
 function render(){if(!active)return;const distance=Math.max(1.7,radius*2.6)*zoom;
 camera.position.set(center.x+Math.sin(yaw)*Math.cos(pitch)*distance,center.y+Math.sin(pitch)*distance,center.z+Math.cos(yaw)*Math.cos(pitch)*distance);
 camera.lookAt(center);renderer.render(scene,camera)}
 function select(i){index=(i+STREET_ASSET_NAMES.length)%STREET_ASSET_NAMES.length;selector.value=String(index);
 const name=STREET_ASSET_NAMES[index];
 try{
 if(active){scene.remove(active);active.traverse(o=>{if(o.isMesh){o.geometry.dispose();const m=Array.isArray(o.material)?o.material:[o.material];m.forEach(x=>x.dispose())}})}
 active=createStreetAsset(name);scene.add(active);active.updateMatrixWorld(true);
 const bounds=new THREE.Box3().setFromObject(active);center=bounds.getCenter(new THREE.Vector3());
 const size=bounds.getSize(new THREE.Vector3());radius=Math.max(size.length()*.55,.8);yaw=.55;pitch=.25;zoom=1;
 const a=auditStreetAsset(active,name);
 facts.innerHTML='<b>'+label(name)+'</b><div>Dimensions: '+a.width+' × '+a.height+' × '+a.depth+' metres</div><div>Triangles: '+a.triangles.toLocaleString()+' · Meshes: '+a.meshes+'</div><div class="'+(a.passes?'':'notice')+'">Geometry checks: '+(a.passes?'Passed':a.issues.join('; '))+'</div>';
 status.textContent='v6 · model '+(index+1)+' of '+STREET_ASSET_NAMES.length+' · restored original material colours';render();
 }catch(e){facts.textContent=name+' failed: '+e.message;status.textContent='Model error — '+e.message;console.error(e)}}
 selector.addEventListener('change',()=>select(Number(selector.value)));
 document.getElementById('prev').onclick=()=>select(index-1);document.getElementById('next').onclick=()=>select(index+1);
 document.getElementById('left').onclick=()=>{yaw-=.35;render()};document.getElementById('right').onclick=()=>{yaw+=.35;render()};
 document.getElementById('near').onclick=()=>{zoom=Math.max(.45,zoom*.8);render()};document.getElementById('far').onclick=()=>{zoom=Math.min(5,zoom*1.25);render()};
 document.getElementById('reset').onclick=()=>select(index);
 const pointers=new Map();let lastX=0,lastY=0,lastPinch=0;
 canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});lastX=e.clientX;lastY=e.clientY});
 canvas.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(pointers.size===2){const p=[...pointers.values()];const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(lastPinch)zoom=Math.max(.45,Math.min(5,zoom*lastPinch/d));lastPinch=d}
 else{yaw+=(e.clientX-lastX)*.012;pitch=Math.max(-.2,Math.min(1.1,pitch+(lastY-e.clientY)*.006));lastX=e.clientX;lastY=e.clientY}render()});
 const release=e=>{pointers.delete(e.pointerId);lastPinch=0};canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);
 window.addEventListener('resize',resize);resize();select(0);
}catch(e){status.textContent='Viewer startup error: '+e.message;facts.textContent='Please send this exact error so it can be fixed.';console.error(e)}
</script></body></html>
