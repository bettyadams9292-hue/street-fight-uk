<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SFUK Police Asset Approval</title><style>*{box-sizing:border-box}body{margin:0;background:#101820;color:#f1f5f9;font:16px system-ui}main{max-width:850px;margin:auto;padding:14px}p{color:#c0cbd6}canvas{display:block;width:100%;height:55vh;min-height:340px;background:#303c48;border-radius:12px;touch-action:none}button,select,textarea{font:inherit;color:white;background:#2d4962;border:1px solid #8295a8;padding:12px;border-radius:9px}.row{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}select{flex:1}textarea{width:100%}.approve{background:#165e47}.reject{background:#793b40}</style></head><body><main><h2>British Police Station · 3D Review</h2><p>4 separate models · pr-dev only · pending approval. Drag to rotate, pinch or use zoom controls.</p><p id="status">Loading viewer…</p><div class="row"><select id="asset"></select><button id="prev">Previous</button><button id="next">Next</button></div><canvas id="canvas"></canvas><div class="row"><button id="left">↶ Rotate</button><button id="right">Rotate ↷</button><button id="plus">Zoom +</button><button id="minus">Zoom −</button><button id="reset">Reset</button></div><p id="detail"></p><div class="row"><button id="approve" class="approve">Approve</button><button id="reject" class="reject">Reject</button><button id="pending">Pending</button></div><textarea id="notes" rows="3" placeholder="Notes for revisions"></textarea><p id="decision"></p><button id="copy">Copy all review results</button><p>Decisions stay in this browser until copied and sent back. Nothing is automatically promoted to the approved pack.</p></main><script type="module">
const $=id=>document.getElementById(id);
try{
 const THREE=await import('https://esm.sh/three@0.180.0');const ts=await import('https://esm.sh/typescript@5.9.3');
 const response=await fetch('https://raw.githubusercontent.com/bettyadams9292-hue/street-fight-uk/36df3d5811696fe8b587c06cf110726b90f7a29e/streetassettesting/british-police-station-assets.ts');if(!response.ok)throw Error('Source '+response.status);
 const code=ts.transpileModule(await response.text(),{compilerOptions:{module:ts.ModuleKind.ESNext,target:ts.ScriptTarget.ES2022}}).outputText.replace(/from\s*(['"])three\1/g,"from 'https://esm.sh/three@0.180.0'");
 const url=URL.createObjectURL(new Blob([code],{type:'text/javascript'}));const {POLICE_ASSETS,createPoliceAsset}=await import(url);URL.revokeObjectURL(url);
 const canvas=$('canvas'),renderer=new THREE.WebGLRenderer({canvas,antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x303c48);
 const scene=new THREE.Scene();scene.add(new THREE.HemisphereLight(0xffffff,0x788899,2.2));const light=new THREE.DirectionalLight(0xffffff,2.7);light.position.set(5,7,6);scene.add(light);
 const camera=new THREE.PerspectiveCamera(42,1,.02,100),pivot=new THREE.Group();scene.add(pivot);
 let index=0,az=.6,el=.25,dist=7,center=1.3,drag=null;const approvals={};
 POLICE_ASSETS.forEach((a,i)=>{const opt=document.createElement('option');opt.value=i;opt.textContent=a.name;$('asset').append(opt)});
 function refresh(){index=Number($('asset').value);pivot.clear();pivot.add(createPoliceAsset(POLICE_ASSETS[index].id));const b=new THREE.Box3().setFromObject(pivot);const s=b.getSize(new THREE.Vector3());center=(b.min.y+b.max.y)/2;dist=Math.max(s.x,s.y,s.z)*1.75;az=.6;el=.25;$('detail').textContent=POLICE_ASSETS[index].name+' · '+POLICE_ASSETS[index].id+' · '+s.x.toFixed(2)+' × '+s.y.toFixed(2)+' × '+s.z.toFixed(2)+' m';$('notes').value=approvals[POLICE_ASSETS[index].id]?.notes||'';status()}
 function status(){$('decision').textContent=POLICE_ASSETS.map(a=>a.name+': '+(approvals[a.id]?.status||'pending')).join(' · ')}
 $('asset').onchange=refresh;$('prev').onclick=()=>{$('asset').value=(index+3)%4;refresh()};$('next').onclick=()=>{$('asset').value=(index+1)%4;refresh()};
 $('left').onclick=()=>az-=.25;$('right').onclick=()=>az+=.25;$('plus').onclick=()=>dist*=.85;$('minus').onclick=()=>dist*=1.15;$('reset').onclick=refresh;
 function save(st){approvals[POLICE_ASSETS[index].id]={status:st,notes:$('notes').value};status()}
 $('approve').onclick=()=>save('approved');$('reject').onclick=()=>save('rejected');$('pending').onclick=()=>save('pending');$('notes').onchange=()=>save(approvals[POLICE_ASSETS[index].id]?.status||'pending');
 $('copy').onclick=()=>{const s=JSON.stringify({branch:'pr-dev',assets:POLICE_ASSETS.map(a=>({...a,...(approvals[a.id]||{status:'pending'})}))},null,2);navigator.clipboard.writeText(s).then(()=>$('status').textContent='Review copied. Paste it into ChatGPT.').catch(()=>$('status').textContent=s)};
 canvas.addEventListener('pointerdown',e=>{canvas.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointermove',e=>{if(!drag||!e.buttons)return;az+=(e.clientX-drag.x)*.008;el=Math.max(-1.1,Math.min(1.1,el+(e.clientY-drag.y)*.006));drag={x:e.clientX,y:e.clientY}});canvas.addEventListener('pointerup',()=>drag=null);
 function render(){const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();camera.position.set(Math.sin(az)*Math.cos(el)*dist,center+Math.sin(el)*dist,Math.cos(az)*Math.cos(el)*dist);camera.lookAt(0,center,0);renderer.render(scene,camera);requestAnimationFrame(render)}
 $('asset').value='0';refresh();$('status').textContent='4 models loaded · V1 · approval pending';render();
}catch(e){$('status').textContent='Viewer error: '+e.message;console.error(e)}
</script></body></html>
